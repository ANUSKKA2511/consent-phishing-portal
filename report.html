<!DOCTYPE html>
<html>
<head>
  <title>Anonymised Simulation Report</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card" style="max-width:900px;">
    <h1>📈 Anonymised Simulation Events</h1>
    <p>No passwords or personal identifiers are stored in this report.</p>
    <table style="width:100%; border-collapse:collapse; font-size:14px;">
      <thead>
        <tr style="background:#1e3c72; color:#fff;">
          <th style="padding:10px; text-align:left;">Timestamp</th>
          <th style="padding:10px; text-align:left;">Participant ID</th>
          <th style="padding:10px; text-align:left;">Event</th>
          <th style="padding:10px; text-align:left;">IP (lab only)</th>
        </tr>
      </thead>
      <tbody>
        {% for e in events %}
        <tr style="border-bottom:1px solid #e5e7eb; {% if loop.index is even %}background:#f9fafb;{% endif %}">
          <td style="padding:10px;">{{ e.timestamp }}</td>
          <td style="padding:10px;"><code>{{ e.participant_id }}</code></td>
          <td style="padding:10px;">{{ e.event }}</td>
          <td style="padding:10px;">{{ e.ip_address }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <p style="margin-top:24px;"><a href="/" class="btn">Restart</a></p>
  </div>
</body>
</html>
